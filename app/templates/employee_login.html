{% extends "base.html" %}

{% block title %}Employee Login - Faceoffice{% endblock %}

{% block content %}
<div class="page-container login-page">
    <h2>Employee Facial Login</h2>
    <p>Look at the camera and we'll verify your identity.</p>

    <div class="login-container">
        <div class="camera-section">
            <video id="cameraFeed" class="camera-video"></video>
            <div class="camera-controls">
                <button type="button" id="startCamera" class="btn btn-primary">Start Camera</button>
                <button type="button" id="capturePhoto" class="btn btn-success" disabled>Capture Face</button>
                <button type="button" id="stopCamera" class="btn btn-danger" disabled>Stop Camera</button>
            </div>

            <canvas id="photoCanvas" style="display:none;"></canvas>
        </div>

        <div id="statusMessage" class="status-message"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script>
let faceDataUrl = null;

document.getElementById('capturePhoto').addEventListener('click', async function() {
    const canvas = document.getElementById('photoCanvas');
    faceDataUrl = canvas.toDataURL('image/jpeg');

    document.getElementById('statusMessage').textContent = 'Processing face... please wait.';
    document.getElementById('statusMessage').className = 'status-message info';

    try {
        const response = await fetch('/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ faceImage: faceDataUrl })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById('statusMessage').textContent = 'Face verified! Redirecting to dashboard...';
            document.getElementById('statusMessage').className = 'status-message success';
            setTimeout(() => window.location.href = '/employee/dashboard', 2000);
        } else {
            document.getElementById('statusMessage').textContent = data.error || 'Face not recognized. Please try again.';
            document.getElementById('statusMessage').className = 'status-message error';
        }
    } catch (e) {
        document.getElementById('statusMessage').textContent = 'Error: ' + e.message;
        document.getElementById('statusMessage').className = 'status-message error';
    }
});
</script>
{% endblock %}
