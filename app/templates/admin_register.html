{% extends "base.html" %}

{% block title %}Admin - Register Employee - Faceoffice{% endblock %}

{% block content %}
<div class="page-container admin-page">
    <h2>Register New Employee</h2>
    <p>Capture the employee's face and enter their details.</p>

    <form id="employeeForm" class="form-container">
        <div class="form-group">
            <label for="employeeName">Full Name *</label>
            <input type="text" id="employeeName" name="employeeName" required>
        </div>

        <div class="form-group">
            <label for="employeeEmail">Email *</label>
            <input type="email" id="employeeEmail" name="employeeEmail" required>
        </div>

        <div class="form-group">
            <label for="employeePhone">Phone Number *</label>
            <input type="tel" id="employeePhone" name="employeePhone" required>
        </div>

        <div class="form-group">
            <label for="employeePassword">Password *</label>
            <input type="password" id="employeePassword" name="password" required minlength="8">
            <small>Minimum 8 characters</small>
        </div>

        <div class="camera-section">
            <h3>Capture Employee Face</h3>
            <video id="cameraFeed" class="camera-video"></video>
            <div class="camera-controls">
                <button type="button" id="startCamera" class="btn btn-primary">Start Camera</button>
                <button type="button" id="capturePhoto" class="btn btn-success" disabled>Capture Face</button>
                <button type="button" id="stopCamera" class="btn btn-danger" disabled>Stop Camera</button>
            </div>

            <canvas id="photoCanvas" style="display:none;"></canvas>
            <div id="photoPreview" class="photo-preview">
                <img id="capturedPhoto" src="" alt="Captured photo" style="display:none;">
            </div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Register Employee</button>
    </form>

    <div class="admin-links">
        <a href="/admin/employees" class="btn btn-secondary">View All Employees</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script>
document.getElementById('employeeForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const canvas = document.getElementById('photoCanvas');
    const photoData = canvas.toDataURL('image/jpeg');

    const formData = new FormData();
    formData.append('name', document.getElementById('employeeName').value);
    formData.append('email', document.getElementById('employeeEmail').value);
    formData.append('phone', document.getElementById('employeePhone').value);
    formData.append('password', document.getElementById('employeePassword').value);
    formData.append('faceImage', photoData);

    try {
        const response = await fetch('/admin/register', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById('statusMessage').textContent = 'Employee registered successfully!';
            document.getElementById('statusMessage').className = 'status-message success';
            setTimeout(() => { window.location.href = '/admin/employees'; }, 2000);
        } else {
            document.getElementById('statusMessage').textContent = data.error || 'Error registering employee';
            document.getElementById('statusMessage').className = 'status-message error';
        }
    } catch (e) {
        document.getElementById('statusMessage').textContent = 'Error: ' + e.message;
        document.getElementById('statusMessage').className = 'status-message error';
    }
});
</script>
{% endblock %}
